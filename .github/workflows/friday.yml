# ═══════════════════════════════════════════════════════════
#  FRIDAY CHOP — GitHub Actions heartbeat
#  Wakes Friday every 5 minutes to chop whatever is waiting
#  in the vault queue. She never sleeps again.
# ═══════════════════════════════════════════════════════════
name: friday-chop

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub's minimum — always on)
  workflow_dispatch: {}      # manual "Run workflow" button for testing

permissions: {}

concurrency:
  group: friday-chop
  cancel-in-progress: false  # never abandon a chop mid-air

jobs:
  chop:
    runs-on: ubuntu-latest
    timeout-minutes: 14      # one pass must always fit; extras wait for the next wake-up
    steps:
      - name: Check out the worker
        uses: actions/checkout@v4

      - name: Install OCR tools (poppler + tesseract)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-fra

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install --quiet -r requirements.txt

      - name: Friday wakes up — one chop pass
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SITE_URL:     ${{ secrets.SITE_URL }}
          SITE_SECRET:  ${{ secrets.SITE_SECRET }}
          GROQ_MODEL:   ${{ secrets.GROQ_MODEL }}
          MAX_JOBS_PER_RUN: "2"
        run: python friday_worker.py --once
